# Release of the Rust app (nexusd, nexusctl). A tag vX.Y.Z builds the Arch,
# deb and rpm packages and the tarball, installs each in a clean container,
# and only then attaches them to the GitHub release.
#
# The old Go app's release is release-go.yml, now manual only.
#
# Not done here yet: pushing the PKGBUILD to the AUR. The AUR package
# nexus-open is still the Go app at 0.3.8, and this app's version must be
# higher than that for pacman to upgrade it in place; that is Matt's call
# (see docs/RELEASE_CHECKLIST.md).
name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.4.0)'
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Release binaries without symbols: a third of the size.
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  # ── deb, rpm and tarball, from one build on Ubuntu 24.04 ────────────────────
  # The oldest glibc the packages support is the build's: 2.39 runs on
  # Debian 13, Ubuntu 24.04, Fedora 40 and newer.
  build:
    name: Build deb, rpm, tarball
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check the tag matches every version in the tree
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          VERSION="${TAG#v}"
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          pkgbuild=$(sed -n 's/^pkgver=//p' packaging/nexusd/arch/PKGBUILD)
          spec=$(sed -n 's/^Version: *//p' packaging/nexusd/rpm/nexus-open.spec)
          metainfo=$(grep -o '<release version="[^"]*"' packaging/desktop/io.nexus.open.metainfo.xml | head -1 | cut -d'"' -f2)
          echo "tag $VERSION, Cargo.toml $cargo, PKGBUILD $pkgbuild, spec $spec, metainfo $metainfo"
          for v in "$cargo" "$pkgbuild" "$spec" "$metainfo"; do
            [[ "$v" == "$VERSION" ]] || { echo "::error::version mismatch: the tag is $VERSION"; exit 1; }
          done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfontconfig-dev dpkg-dev rpm

      # The pinned compiler only: rust-toolchain.toml would also fetch the
      # Windows and macOS standard libraries.
      - name: Install Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          echo "RUSTUP_TOOLCHAIN=1.100.0" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-ubuntu-24.04-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-ubuntu-24.04-

      - name: Build nexusd and nexusctl
        run: cargo build --release --locked -p nexusd -p nexusctl

      - name: Package
        run: |
          rm -rf target/dist
          packaging/nexusd/deb/build-deb.sh target/release target/dist
          packaging/nexusd/rpm/build-rpm.sh target/release target/dist
          packaging/nexusd/tarball/build-tarball.sh target/release target/dist
          ls -l target/dist

      - uses: actions/upload-artifact@v7
        with:
          name: packages-ubuntu
          path: target/dist/
          retention-days: 7

  # ── The Arch package, built with makepkg on Arch ────────────────────────────
  arch:
    name: Build Arch package
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      # git before checkout, so the checkout is a repository (build-local.sh
      # packs it with git archive).
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed git rust namcap

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # makepkg refuses to run as root.
      - name: makepkg
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "git config --global --add safe.directory '$GITHUB_WORKSPACE'"
          su builder -c "cd '$GITHUB_WORKSPACE' && packaging/nexusd/arch/build-local.sh target/dist"
          ls -l target/dist

      - name: namcap
        run: |
          namcap packaging/nexusd/arch/PKGBUILD
          namcap target/dist/*.pkg.tar.zst

      - uses: actions/upload-artifact@v7
        with:
          name: packages-arch
          path: target/dist/
          retention-days: 7

  # ── Install each package in a clean container ───────────────────────────────
  test:
    name: Install test (${{ matrix.kind }}, ${{ matrix.image }})
    runs-on: ubuntu-24.04
    needs: [build, arch]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: arch, image: 'archlinux:latest', file: '*.pkg.tar.zst', artifact: packages-arch }
          - { kind: deb, image: 'debian:stable', file: '*.deb', artifact: packages-ubuntu }
          - { kind: deb, image: 'ubuntu:24.04', file: '*.deb', artifact: packages-ubuntu }
          - { kind: rpm, image: 'fedora:latest', file: '*.rpm', artifact: packages-ubuntu }
          - { kind: tarball, image: 'debian:stable', file: '*-linux.tar.gz', artifact: packages-ubuntu }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist/

      - name: Install and check
        env:
          IMAGE: ${{ matrix.image }}
          KIND: ${{ matrix.kind }}
          FILE: ${{ matrix.file }}
        run: |
          shopt -s nullglob
          # shellcheck disable=SC2206 # FILE is a glob from the matrix
          pkgs=(dist/$FILE)
          [[ ${#pkgs[@]} == 1 ]] || { echo "::error::expected one $FILE, found ${#pkgs[@]}"; exit 1; }
          pkg=$(basename "${pkgs[0]}")
          docker run --rm \
            -v "$PWD/packaging/nexusd/test-install.sh:/test-install.sh:ro" \
            -v "$PWD/dist:/dist:ro" \
            "$IMAGE" bash /test-install.sh "$KIND" "/dist/$pkg"

  # ── Publish, once every install test has passed ─────────────────────────────
  publish:
    name: Publish release
    runs-on: ubuntu-24.04
    needs: [build, arch, test]
    permissions:
      contents: write
      models: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist/

      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Install git-cliff
        run: |
          curl -sSL https://github.com/orhun/git-cliff/releases/download/v2.13.1/git-cliff-2.13.1-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz --strip-components=1 -C /usr/local/bin git-cliff-2.13.1/git-cliff
          git-cliff --version

      - name: Release notes
        env:
          TAG: ${{ needs.build.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -vx "$TAG" | head -1)
          if [[ -n "$PREV_TAG" ]]; then
            git-cliff "${PREV_TAG}..${TAG}" --strip all > /tmp/cliff-notes.md
          else
            git-cliff --tag "$TAG" --strip all > /tmp/cliff-notes.md
          fi
          SUMMARY=$(python3 .github/scripts/ai-release-summary.py < /tmp/cliff-notes.md || true)
          {
            if [[ -n "$SUMMARY" ]]; then printf '%s\n\n' "$SUMMARY"; fi
            echo "Install: see [docs/INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/INSTALL.md)."
            echo
            cat /tmp/cliff-notes.md
          } > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "Nexus Open $VERSION" --notes-file /tmp/release-notes.md
            gh release upload "$TAG" --clobber dist/*
          else
            gh release create "$TAG" --title "Nexus Open $VERSION" --notes-file /tmp/release-notes.md dist/*
          fi
