[package]
name = "nexus-store"
description = "Where Nexus Open keeps settings, layouts, takeovers and sources: SQLite"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
nexus-core = { path = "../nexus-core" }
# `bundled` compiles SQLite in: the same version on every platform and
# nothing to install. Packagers who prefer the system library can drop it.
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
# `display` writes TOML values; `preserve_order` keeps keys in the order the
# types declare them (type, width, label…), not alphabetical.
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std", "display", "preserve_order"] }
toml_edit = { version = "0.25.19", default-features = false, features = ["parse"] }

[lints]
workspace = true
