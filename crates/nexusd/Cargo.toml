[package]
name = "nexusd"
description = "Nexus daemon: drives the Corsair iCUE Nexus touch strip"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2.43"
interprocess = "2.4.8"
nexus-control = { path = "../nexus-control" }
nexus-core = { path = "../nexus-core" }
nexus-device = { path = "../nexus-device" }
nexus-ui = { path = "../nexus-ui" }
serde_json = "1.0.154"
notify = { version = "8.2.2", default-features = false, features = ["macos_kqueue"] }

[lints]
workspace = true
