[package]
name = "nexusd"
description = "Nexus daemon: drives the Corsair iCUE Nexus touch strip"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
jiff = "0.2.43"
nexus-core = { path = "../nexus-core" }
nexus-device = { path = "../nexus-device" }
nexus-ui = { path = "../nexus-ui" }
notify = { version = "8.2.2", default-features = false, features = ["macos_kqueue"] }

[lints]
workspace = true
