[package]
name = "nexusctl"
description = "Command-line control for the Nexus Open daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
nexus-control = { path = "../nexus-control" }
nexus-core = { path = "../nexus-core" }
nexus-store = { path = "../nexus-store" }
serde_json = "1.0.154"

# Device checks in `doctor` are Linux-only for now.
[target.'cfg(target_os = "linux")'.dependencies]
nexus-device = { path = "../nexus-device" }

[lints]
workspace = true
