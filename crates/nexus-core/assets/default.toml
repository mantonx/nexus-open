# Nexus Open layout.
#
# The strip is 640 px wide. Each page is a row of widgets, left to right; a
# page's widget widths must add up to 640 or less. Swipe to change page.
#
# Signals are named readings published by sources, in base units:
#   cpu.temp, gpu.temp, weather.temp   degrees Celsius
#   cpu.load, gpu.load, mem.used       percent
#   net.down, net.up                   bytes per second
#   media.title, media.artist, media.status (text), media.position,
#   media.length (seconds): read by the "media" widget
# Thresholds (warn, crit) use those base units too.
#
# Any widget can act on a tap and on a long press (hold), for example:
#   tap = { page = "Clock" }               next, prev, or a page name
#   tap = { media = "play-pause" }         play-pause, next, previous, stop
#   tap = { run = ["pavucontrol"] }        a program and its arguments, no shell
#   hold = { open = "https://example.org" } a URL or file, in the default app
#   tap = { publish = { signal = "mode", value = "focus" } }

[settings]
font = "ibm-plex-sans"       # ibm-plex-sans, atkinson-hyperlegible, roboto, noto-sans, lato
temperature = "celsius"      # celsius or fahrenheit
clock = "24h"                # 24h or 12h

# Weather comes from Open-Meteo, which is sent this location (or the
# coordinates) and nothing else. Uncomment and set it to show weather.temp:
# [weather]
# location = "Lisbon"          # or "City, region, country" to pick the right one
# latitude = 38.72             # optional: coordinates instead of a name
# longitude = -9.14

[[page]]
name = "System"

[[page.widget]]
type = "clock"
width = 107
tap = { page = "Clock" }

[[page.widget]]
type = "media"
width = 107
tap = { media = "play-pause" }
hold = { media = "next" }

[[page.widget]]
type = "value"
width = 107
label = "Weather"
signal = "weather.temp"

[[page.widget]]
type = "value"
width = 107
label = "CPU"
signal = "cpu.temp"
graph = "area"
warn = 75
crit = 90

[[page.widget]]
type = "value"
width = 106
label = "GPU"
signal = "gpu.temp"
graph = "area"
warn = 75
crit = 90

[[page.widget]]
type = "rate"
width = 106
label = "Net"
down = "net.down"
up = "net.up"

[[page]]
name = "Performance"

[[page.widget]]
type = "value"
width = 240
label = "CPU"
signal = "cpu.temp"
graph = "area"
warn = 75
crit = 90

[[page.widget]]
type = "value"
width = 240
label = "GPU"
signal = "gpu.temp"
graph = "area"
warn = 75
crit = 90

[[page.widget]]
type = "rate"
width = 160
label = "Net"
down = "net.down"
up = "net.up"

[[page]]
name = "Load"

[[page.widget]]
type = "value"
width = 213
label = "CPU load"
signal = "cpu.load"
graph = "line"
warn = 85

[[page.widget]]
type = "value"
width = 213
label = "GPU load"
signal = "gpu.load"
graph = "line"
warn = 85

[[page.widget]]
type = "value"
width = 214
label = "Memory"
signal = "mem.used"
graph = "line"
warn = 90

[[page]]
name = "Clock"

[[page.widget]]
type = "clock"
width = 640
tap = { page = "System" }
