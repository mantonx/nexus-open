## Starter: Monitor. Each processor large, its temperature with its load
## beside it; then memory, network and the time. Volume changes still show
## briefly.

[[page]]
name = "Monitor"

[[page.widget]]
type = "value"
width = 320
label = "CPU"
signal = "cpu.temp"
warn = 75
crit = 90
second = "cpu.load"
second_label = "load"
second_warn = 85

[[page.widget]]
type = "value"
width = 320
label = "GPU"
signal = "gpu.temp"
warn = 80
crit = 90
second = "gpu.load"
second_label = "load"
second_warn = 85

[[page]]
name = "System"

[[page.widget]]
type = "value"
width = 213
label = "Memory"
signal = "mem.used"
warn = 85
crit = 95

[[page.widget]]
type = "rate"
width = 213
label = "Network"
down = "net.down"
up = "net.up"

[[page.widget]]
type = "clock"
width = 214

[[takeover]]
name = "Volume"
on_change = ["volume.level", "volume.muted"]
seconds = 2

[[takeover.widget]]
type = "slider"
width = 640
label = "Volume"
controls = "volume"
